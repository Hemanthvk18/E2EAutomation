name: Monthly Allure Execution

on:
  schedule:
    # ============================================
    # Runs at 11:59 PM IST on last days of month
    # UTC Time: 18:29 or 18:59 depending on IST
    # ============================================
    - cron: "59 18 28-31 * *"

env:
  EMAIL: ${{ secrets.EMAIL }}
  PASSWORD: ${{ secrets.PASSWORD }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # Checkout Source Code
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # Setup Java 21
      # ============================================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ============================================
      # Verify Chrome Browser
      # ============================================
      - name: Verify Chrome
        run: google-chrome --version

      # ============================================
      # Validate GitHub Secrets
      # ============================================
      - name: Validate Credentials
        run: |
          if [ -z "${{ secrets.EMAIL }}" ] || [ -z "${{ secrets.PASSWORD }}" ]; then
            echo "❌ ERROR: EMAIL or PASSWORD secrets not configured!"
            exit 1
          fi
          
          echo "✅ Credentials validated successfully"

      # ============================================
      # Clean Previous Reports
      # ============================================
      - name: Clean old reports
        run: |
          rm -rf target
          mkdir -p target/allure-results

      # ============================================
      # Run Main Smoke Suite
      # ============================================
      - name: Run Initial Tests
        continue-on-error: true
        run: |
          xvfb-run mvn clean test \
          -Denv="dev" \
          -Durl="https://rahulshettyacademy.com/client" \
          -Dbrowser="chrome" \
          -Dheadless=true \
          -Dcucumber.filter.tags="@Smoke" \
          -DEMAIL="${{ env.EMAIL }}" \
          -DPASSWORD="${{ env.PASSWORD }}" \
          -DfailIfNoTests=false

      # ============================================
      # Rerun Failed Test Cases
      # ============================================
      - name: Rerun Failed Tests
        if: always() && hashFiles('target/rerun.txt') != ''
        continue-on-error: true
        run: |
          xvfb-run mvn test \
          -Dtest=testrunner.RerunFailedTestNgRunner \
          -DEMAIL="${{ env.EMAIL }}" \
          -DPASSWORD="${{ env.PASSWORD }}" \
          -DfailIfNoTests=false

      # ============================================
      # Debug Target Folder
      # ============================================
      - name: Debug Target Folder
        if: always()
        run: |
          echo "========== TARGET FOLDER =========="
          ls -R target || echo "❌ Target folder not found"

      # ============================================
      # Generate Allure Report
      # ============================================
      - name: Generate Allure Report
        if: always()
        run: |
          mvn io.qameta.allure:allure-maven:report

      # ============================================
      # Verify Allure Report Generation
      # ============================================
      - name: Verify Allure Report
        if: always()
        run: |
          echo "========== ALLURE REPORT =========="
          ls -R target/site || echo "❌ Allure report not generated"

      # ============================================
      # Upload Reports as Artifact
      # ============================================
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-test-reports
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
          if-no-files-found: warn

#      # ============================================
#      # Deploy Allure Report to GitHub Pages
#      # ============================================
#      - name: Deploy to gh-pages
#        if: always()
#        uses: peaceiris/actions-gh-pages@v3
#        with:
#          github_token: ${{ secrets.GITHUB_TOKEN }}
#          publish_dir: ./target/site/allure-maven-plugin
#          publish_branch: gh-pages


      # =========================
      # Deploy Monthly Report
      # =========================
      - name: Deploy Monthly Report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/allure-maven-plugin
          destination_dir: autoMonthly
          publish_branch: gh-pages
          keep_files: true

      # ============================================
      # Print Final Report URL
      # ============================================
      - name: Print Report URL
        if: always()
        run: |
          echo "==========================================="
          echo "✅ Allure Report Published Successfully"
          echo "==========================================="
          echo "GitHub Pages URL:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      

      # =========================
      # Add Report Link to Job Summary
      # =========================
      - name: Add Report Link to Job Summary
        if: always()
        run: |
          echo "## ✅ Allure Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Open Latest Report" >> $GITHUB_STEP_SUMMARY
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY





    
