name: Manual Allure Execution

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to run tests on (e.g. dev, int, staging)"
        required: true
        default: "dev"
      url:
        description: "Base URL to run tests on"
        required: true
        default: "https://rahulshettyacademy.com/client"
      browser:
        description: "Browser to run tests on (chrome, firefox, edge)"
        required: true
        default: "chrome"
      tags:
        description: "Cucumber tags to run (e.g. @Smoke, @Regression)"
        required: true
        default: "@Regression"
      report_dir:
        description: "Folder name under gh-pages to publish Allure report (default: latest) (e.g. Module_Name, Page_Name and Release_Name etc.)"
        required: false
        default: "latest"


env:
  TEST_ADMIN1_EMAILID: ${{ secrets.TEST_ADMIN1_EMAILID }}
  TEST_ADMIN2_EMAILID: ${{ secrets.TEST_ADMIN2_EMAILID }}
  TEST_ADMIN3_EMAILID: ${{ secrets.TEST_ADMIN3_EMAILID }}

  TEST_ADMIN1_PASS: ${{ secrets.TEST_ADMIN1_PASS }}
  TEST_ADMIN2_PASS: ${{ secrets.TEST_ADMIN2_PASS }}
  TEST_ADMIN3_PASS: ${{ secrets.TEST_ADMIN3_PASS }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest


    steps:

      # =========================
      # Checkout Project
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Setup Java
      # =========================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # =========================
      # Verify Chrome
      # =========================
      - name: Verify Chrome
        run: google-chrome --version

      # =========================
      # Validate Secrets
      # =========================
      - name: Validate Credentials
        run: |
          if [ -z "${{ secrets.TEST_ADMIN1_EMAILID }}" ] || \
             [ -z "${{ secrets.TEST_ADMIN2_EMAILID }}" ] || \
             [ -z "${{ secrets.TEST_ADMIN3_EMAILID }}" ] || \
             [ -z "${{ secrets.TEST_ADMIN1_PASS }}" ] || \
             [ -z "${{ secrets.TEST_ADMIN2_PASS }}" ] || \
             [ -z "${{ secrets.TEST_ADMIN3_PASS }}" ]; then
            echo "❌ One or more user credentials are missing"
            exit 1
          fi
          
          echo "✅ Credentials validated successfully"

      # =========================
      # Clean Old Reports
      # =========================
      - name: Clean old reports
        run: |
          rm -rf target
          mkdir -p target/allure-results

      # =========================
      # Run Main Tests
      # =========================
      - name: Run Initial Tests
        continue-on-error: true
        run: |
          xvfb-run mvn clean test \
          -Denv="${{ github.event.inputs.env }}" \
          -Durl="${{ github.event.inputs.url }}" \
          -Dbrowser="${{ github.event.inputs.browser }}" \
          -Dheadless=true \
          -Dcucumber.filter.tags="${{ github.event.inputs.tags }}" \
          -DTEST_ADMIN1_EMAILID="${{ env.TEST_ADMIN1_EMAILID }}" \
          -DTEST_ADMIN2_EMAILID="${{ env.TEST_ADMIN2_EMAILID }}" \
          -DTEST_ADMIN3_EMAILID="${{ env.TEST_ADMIN3_EMAILID }}" \
          -DTEST_ADMIN1_PASS="${{ env.TEST_ADMIN1_PASS }}" \
          -DTEST_ADMIN2_PASS="${{ env.TEST_ADMIN2_PASS }}" \
          -DTEST_ADMIN3_PASS="${{ env.TEST_ADMIN3_PASS }}"

      # =========================
      # Rerun Failed Tests
      # =========================
      - name: Rerun Failed Tests
        if: always() && hashFiles('target/rerun.txt') != ''
        continue-on-error: true
        run: |
          xvfb-run mvn test \
          -Dtest=testrunner.RerunFailedTestNgRunner

      # =========================
      # Debug Target Folder
      # =========================
      - name: Debug Target Folder
        if: always()
        run: |
          echo "========== TARGET FOLDER =========="
          ls -R target || echo "No target folder found"

      # =========================
      # Generate Allure Report
      # =========================
      - name: Generate Allure Report
        if: always()
        run: |
          mvn io.qameta.allure:allure-maven:report

      # =========================
      # Verify Allure Report
      # =========================
      - name: Verify Allure Report
        if: always()
        run: |
          echo "========== ALLURE REPORT =========="
          ls -R target/site || echo "Allure report not generated"

      # =========================
      # Upload Reports Artifact
      # =========================
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
          if-no-files-found: warn

      # =========================
      # Deploy Manual Report
      # =========================
      - name: Deploy Manual Report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/allure-maven-plugin
          destination_dir: ${{ github.event.inputs.report_dir }}
          publish_branch: gh-pages
          keep_files: true

      # ============================================
      # Add Manual Report Link to Job Summary
      # ============================================
      - name: Add Manual Report Link
        if: always()
        run: |
          echo "## ✅ Manual Allure Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Open Latest Manual Report" >> $GITHUB_STEP_SUMMARY
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.event.inputs.report_dir }}/" >> $GITHUB_STEP_SUMMARY
